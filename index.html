<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UHaifa Matrix Effect</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1F3343;
      height: 100%;
      font-family: monospace;
    }

    canvas {
      display: block;
      clip-path: url(#faceMask);
    }

    .cta-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      background-color: #0EBBE6;
      color: #1F3343;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      z-index: 10;
      transition: background 0.3s ease;
    }

    .cta-button:hover {
      background-color: #0a9fc2;
    }

    svg {
      position: absolute;
      top: -1000px;
      left: -1000px;
      height: 0;
      width: 0;
    }
  </style>
</head>
<body>

<svg>
  <defs>
    <clipPath id="faceMask" clipPathUnits="objectBoundingBox">
      <!-- מסכת פנים גנרית אפשר להחליף ל־SVG מדויק -->
      <path transform="scale(0.0015, 0.002)" d="M512,0 C790,0 1024,234 1024,512 C1024,790 790,1024 512,1024 C234,1024 0,790 0,512 C0,234 234,0 512,0 Z"/>
    </clipPath>
  </defs>
</svg>

<canvas id="matrixCanvas"></canvas>
<button class="cta-button">Your future starts here!</button>

<script>
  const canvas = document.getElementById("matrixCanvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const letters = "UHaifa International School ".split("");
  const fontSize = 14;
  const columns = Math.floor(window.innerWidth / fontSize);
  const drops = Array(columns).fill(1);

  function drawMatrix() {
    ctx.fillStyle = "rgba(31, 51, 67, 0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0EBBE6";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }

      drops[i]++;
    }
  }

  setInterval(drawMatrix, 33);
</script>

</body>
</html>
